name: Node.js CI

# The deploy action pushes the built site to the github-pages branch.
permissions:
  contents: write

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # The scenes are drawn on demand rather than on a clock, so the
      # comparison is exact: any difference at all is a change somebody made.
      - name: Install the browser for the visual tests
        run: npx playwright install --with-deps chromium

      - name: Visual regression tests
        run: npm run test:visual

      - name: Keep the differences when they fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7

      - name: Build
        run: npm run build:github-pages

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: github-pages
          folder: dist
