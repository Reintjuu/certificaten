<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queeste naar de Certificaten</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111;
        color: #ddd;
        font-family: monospace;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px;
      }
      canvas#game {
        width: min(96vw, 960px);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 4px solid #222;
      }
      #controls {
        color: #aaa;
        font-size: 14px;
      }
      #console {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      #console canvas {
        width: min(96vw, 960px);
        border: 1px solid #333;
      }
      #console h2 {
        font-size: 13px;
        color: #888;
        margin: 4px 0 0;
        font-weight: normal;
      }
      #console #status {
        color: #aaa;
        font-size: 12px;
      }
      #console #generations {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        max-width: min(96vw, 960px);
        justify-content: center;
      }
      #console button {
        background: #222;
        color: #ddd;
        border: 1px solid #444;
        padding: 4px 9px;
        cursor: pointer;
        font: inherit;
      }
      #console button:hover {
        background: #333;
      }
      #console button.active {
        background: #ffd84a;
        color: #111;
        border-color: #ffd84a;
      }
      #console #architecture {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #aaa;
        font-size: 12px;
      }
      #console input {
        background: #111;
        color: #ddd;
        border: 1px solid #444;
        padding: 3px 6px;
        font: inherit;
      }
      #console #network {
        cursor: crosshair;
      }
    </style>
    <script type="module" crossorigin src="/certificaten/assets/index-nXupe_B8.js"></script>
  </head>
  <body>
    <div class="wrap">
      <canvas id="game" width="480" height="270"></canvas>
      <p id="controls">Pijltjes / A-D = bewegen · Spatie / W = springen · Shift = rennen · R = opnieuw</p>
      <div id="console" hidden></div>
    </div>
  </body>
</html>
