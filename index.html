<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queeste naar de Certificaten</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111;
        color: #ddd;
        font-family: monospace;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px;
      }
      canvas#game {
        width: min(96vw, 960px);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 4px solid #222;
      }
      #controls {
        color: #aaa;
        font-size: 14px;
      }
      #console {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      #console canvas {
        width: min(96vw, 960px);
        border: 1px solid #333;
      }
      #console h2 {
        font-size: 13px;
        color: #888;
        margin: 4px 0 0;
        font-weight: normal;
      }
      #console #status {
        color: #aaa;
        font-size: 12px;
      }
      #console #generations {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        max-width: min(96vw, 960px);
        justify-content: center;
      }
      #console button {
        background: #222;
        color: #ddd;
        border: 1px solid #444;
        padding: 4px 9px;
        cursor: pointer;
        font: inherit;
      }
      #console button:hover {
        background: #333;
      }
      #console button.active {
        background: #ffd84a;
        color: #111;
        border-color: #ffd84a;
      }
      #console #architecture {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #aaa;
        font-size: 12px;
      }
      #console input {
        background: #111;
        color: #ddd;
        border: 1px solid #444;
        padding: 3px 6px;
        font: inherit;
      }
      #console #network {
        cursor: crosshair;
      }

      /* The on-screen pad, which only exists on a device you play with your
         thumbs. It is laid over the picture rather than under it, because a
         phone in landscape has no room to spare below. */
      #touch {
        display: none;
      }
      body.touch {
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
      }
      body.touch .wrap {
        padding: 0;
        gap: 0;
      }
      /* As large as fits: the whole width in portrait, the whole height in
         landscape, which is where 16:9 runs out of room first. */
      body.touch canvas#game {
        width: min(100vw, calc(100vh * 16 / 9));
        border: 0;
      }
      body.touch #controls {
        font-size: 11px;
        padding: 2px 8px;
        text-align: center;
      }
      body.touch .wrap {
        min-height: 100vh;
        justify-content: center;
      }
      body.touch #touch {
        display: block;
        position: fixed;
        inset: auto 0 0 0;
        height: 50vmin;
        pointer-events: none;
      }
      /* Hidden while the pad has nothing to drive: the title screen and the
         console are tapped and clicked, not steered. */
      body.touch #touch[hidden] {
        display: none;
      }
      /* Sized in vmin so a thumb finds the same button in either
         orientation: vw alone makes them enormous in landscape. */
      .touch-button {
        position: absolute;
        bottom: 5vmin;
        width: 17vmin;
        height: 17vmin;
        max-width: 96px;
        max-height: 96px;
        border-radius: 50%;
        border: 2px solid #555;
        background: rgba(20, 20, 20, 0.4);
        color: #eee;
        font: inherit;
        font-size: 15px;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .touch-button.pressed {
        background: rgba(255, 216, 74, 0.75);
        color: #111;
      }
      .touch-left {
        left: 3vmin;
      }
      .touch-right {
        left: 21vmin;
      }
      /* Stacked directly above the pair below it, thumb's reach away. */
      .touch-down {
        left: 12vmin;
        bottom: calc(5vmin + 19vmin);
      }
      .touch-run {
        right: 21vmin;
      }
      .touch-jump {
        right: 3vmin;
      }
    </style>
    <script type="module" crossorigin src="/certificaten/assets/index-C5CeDjwh.js"></script>
  </head>
  <body>
    <div class="wrap">
      <canvas id="game" width="480" height="270"></canvas>
      <p id="controls">Pijltjes / A-D = bewegen · Spatie / W = springen · Shift = rennen · R = opnieuw</p>
      <div id="console" hidden></div>
      <div id="touch" hidden></div>
    </div>
  </body>
</html>
