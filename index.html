<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queeste naar de Certificaten</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        display: grid;
        place-items: center;
      }
      canvas {
        width: min(96vw, 960px);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 4px solid #222;
      }
      p {
        position: fixed;
        bottom: 8px;
        color: #aaa;
        font: 14px monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="480" height="270"></canvas>
    <p>Pijltjes / A-D = bewegen · Spatie / W = springen · Shift = rennen · R = opnieuw</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
