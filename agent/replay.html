<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI console</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111;
        color: #ddd;
        font-family: monospace;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px;
      }
      canvas#game {
        width: min(96vw, 960px);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 4px solid #222;
      }
      canvas#chart {
        width: min(96vw, 960px);
        border: 1px solid #333;
      }
      button {
        background: #222;
        color: #ddd;
        border: 1px solid #444;
        padding: 4px 9px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #333;
      }
      button.active {
        background: #ffd84a;
        color: #111;
        border-color: #ffd84a;
      }
      #generations {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        max-width: min(96vw, 960px);
        justify-content: center;
      }
      #status {
        color: #aaa;
        font-size: 12px;
      }
      h2 {
        font-size: 13px;
        color: #888;
        margin: 4px 0 0;
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <canvas id="game" width="480" height="270"></canvas>
      <div id="status"></div>
      <h2>Fitness per generatie (★ = beste). Escape brengt je terug naar het menu.</h2>
      <canvas id="chart" width="960" height="180"></canvas>
      <div id="generations"></div>
    </div>
    <script type="module" src="./replay.ts"></script>
  </body>
</html>
