<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent replay</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; display: grid; place-items: center; font-family: monospace; }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    canvas { width: min(96vw, 960px); image-rendering: pixelated; image-rendering: crisp-edges; border: 4px solid #222; }
    #levels button { margin: 0 4px; padding: 6px 12px; cursor: pointer; }
    #status { color: #aaa; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="levels"></div>
    <canvas id="game" width="480" height="270"></canvas>
    <div id="status"></div>
  </div>
  <script type="module" src="./replay.ts"></script>
</body>
</html>
